<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elene ❤</title>
<style>
  :root { --c: #ff1744; }
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", Georgia, serif;
    animation: color 6s infinite;
  }
  .orbit {
    animation: orbit 5s linear infinite;
    display: flex; flex-direction: column; align-items: center;
  }
  .from {
    color: var(--c);
    font-size: clamp(18px, 4vw, 28px);
    letter-spacing: 3px;
    margin-bottom: 8px;
    text-shadow: 0 0 12px var(--c);
  }
  .heart-wrap {
    position: relative;
    width: min(60vw, 320px);
    animation: beat 1.2s ease-in-out infinite;
  }
  svg { width: 100%; display: block; overflow: visible; }
  .heart {
    fill: rgba(255,255,255,0.03);
    stroke: var(--c);
    stroke-width: 4;
    filter: drop-shadow(0 0 14px var(--c));
  }
  .name {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding-bottom: 8%;
    font-size: clamp(28px, 8vw, 54px);
    font-weight: 700;
    color: var(--c);
    text-shadow: 0 0 16px var(--c);
  }
  @property --c { syntax: "<color>"; inherits: true; initial-value: #ff1744; }
  @keyframes color {
    0%, 100% { --c: #ff1744; }   /* წითელი */
    33%      { --c: #ff69b4; }   /* ვარდისფერი */
    66%      { --c: #a855f7; }   /* იასამნისფერი */
  }
  @keyframes orbit {
    from { transform: rotate(0deg)   translateX(70px) rotate(0deg); }
    to   { transform: rotate(360deg) translateX(70px) rotate(-360deg); }
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.08); }
    30% { transform: scale(1); }
    45% { transform: scale(1.06); }
  }
</style>
</head>
<body>
  <div class="orbit">
    <div class="from">From Saba</div>
    <div class="heart-wrap">
      <svg viewBox="0 0 100 90">
        <path class="heart" d="M50 85 C10 55 2 35 8 20 C15 4 38 4 50 22 C62 4 85 4 92 20 C98 35 90 55 50 85 Z"/>
      </svg>
      <div class="name">Elene</div>
    </div>
  </div>
</body>
</html>
